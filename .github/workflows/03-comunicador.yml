name: Comunicador de la Legión

on:
  workflow_dispatch:
    inputs:
      villano:
        description: "¿Qué villano envía el mensaje?"
        required: true
        type: choice
        options:
          - Lex Luthor
          - Magneto
          - Joker
          - Mystique
          - Brainiac
      
      mensaje:
        description: "Mensaje para el consejo"
        required: true
        default: "La misión fue un éxito"

      cow_character:
        description: "Elige un dibujo para el mensaje"
        required: true
        type: choice
        options:
          - eyes
          - cat
          - dragon
          - ghostbusters
          - vader

      prioridad:
        description: "Nivel de prioridad"
        required: true
        type: choice
        options:
          - Normal
          - Alta
          - Crítica

jobs:
  transmitir-mensaje:
    runs-on: ubuntu-latest

    steps:
      - name: Instalar el transmisor de la Legión
        run: sudo apt-get install -y cowsay

      - name: Imprimir inputs
        run: |
          echo "======================"
          echo "Transimisión interceptada"
          echo "======================"
          echo ""
          echo "De: ${{ inputs.villano }}"
          echo ""
          echo "Fecha: $(date -u +"%d/%m/%Y - %H:%M UTC")"
          echo "----- Mensaje-----"
          cowsay -f "${{ inputs.cow_character }}" "${{ inputs.mensaje }}"
          echo ""
          echo "--- ${{ inputs.villano }} ---"
          echo "..."
